server:
  port: ${GATEWAY_PORT:9091}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:9092}
              predicates:
                - Path=/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Request, true
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: user-service
              uri: ${AUTH_SERVICE_URL:http://localhost:9092}
              predicates:
                - Path=/api/users/**
              filters:
                - AddRequestHeader=X-Gateway-Request, true
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: temples-service
              uri: ${TEMPLES_SERVICE_URL:http://localhost:9093}
              predicates:
                - Path=/api/catalog/temples/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: places-service
              uri: ${PLACES_SERVICE_URL:http://localhost:9094}
              predicates:
                - Path=/api/catalog/places/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: events-service
              uri: ${EVENTS_SERVICE_URL:http://localhost:9095}
              predicates:
                - Path=/api/catalog/events/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: offers-service
              uri: ${OFFERS_SERVICE_URL:http://localhost:9096}
              predicates:
                - Path=/api/catalog/offers/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: gallery-service
              uri: ${GALLERY_SERVICE_URL:http://localhost:9097}
              predicates:
                - Path=/api/catalog/gallery/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: contact-service
              uri: ${CONTACT_SERVICE_URL:http://localhost:9099}
              predicates:
                - Path=/api/catalog/contact/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: trips-service
              uri: ${TRIPS_SERVICE_URL:http://localhost:9100}
              predicates:
                - Path=/api/catalog/trips/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: stays-service
              uri: ${STAYS_SERVICE_URL:http://localhost:9101}
              predicates:
                - Path=/api/catalog/hotels/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:9102}
              predicates:
                - Path=/api/bookings/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: contact-enquiries
              uri: ${CONTACT_SERVICE_URL:http://localhost:9099}
              predicates:
                - Path=/api/enquiries/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: ceo-service
              uri: ${CEO_SERVICE_URL:http://localhost:9110}
              predicates:
                - Path=/api/roles/ceo/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: admin-service
              uri: ${ADMIN_SERVICE_URL:http://localhost:9111}
              predicates:
                - Path=/api/roles/admin/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: manager-service
              uri: ${MANAGER_SERVICE_URL:http://localhost:9112}
              predicates:
                - Path=/api/roles/manager/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: staff-service
              uri: ${STAFF_SERVICE_URL:http://localhost:9113}
              predicates:
                - Path=/api/roles/staff/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:9114}
              predicates:
                - Path=/api/roles/customer/**
              filters:
                - SetRequestHeader=X-Internal-Gateway-Token, ${app.gateway.internal-token}

eureka:
  client:
    enabled: false

app:
  gateway:
    internal-token: ${APP_GATEWAY_INTERNAL_TOKEN:test-gateway-internal-token-at-least-32-bytes}
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-key-change-me-to-32-chars}
