server:
  port: ${AUTH_PORT:9092}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pddh_auth_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}

app:
  jwt:
    secret: ${JWT_SECRET:pddh-local-development-jwt-secret-change-before-deployment}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  gateway:
    internal-token: ${APP_GATEWAY_INTERNAL_TOKEN:pddh-local-development-gateway-token-change-before-deployment}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}
    org.springframework.jdbc.core.JdbcTemplate: ${SQL_LOG_LEVEL:DEBUG}
    org.springframework.jdbc.datasource.init.ScriptUtils: ${SQL_LOG_LEVEL:INFO}
