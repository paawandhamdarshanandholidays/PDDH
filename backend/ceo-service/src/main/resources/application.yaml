server:
  port: ${CEO_SERVICE_PORT:9110}
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ceo-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/pddh_auth_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  profile-sync:
    topic: pddh.profile.ceo
    table: ceo
  role:
    expected: CEO
    path: /api/roles/ceo
    display-name: CEO
    hierarchy: CEO > ADMIN > MANAGER > STAFF > CUSTOMER
    capabilities: [full-organization-control, manage-all-roles, manage-content, manage-bookings, view-enquiries]
  jwt:
    secret: ${JWT_SECRET}
